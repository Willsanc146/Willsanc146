<svg fill="none" viewBox="0 0 1000 240" width="100%" height="240" xmlns="http://www.w3.org/2000/svg">
  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml">
      <style>
        .container {
          box-sizing: border-box;
          width: 100%;
          height: 240px;
          background: radial-gradient(circle at 85% 20%, rgba(79, 192, 141, 0.12), transparent 40%),
                      radial-gradient(circle at 15% 80%, rgba(0, 150, 136, 0.15), transparent 45%),
                      #0B0F17;
          border: 1px solid rgba(255, 255, 255, 0.08);
          border-radius: 12px;
          padding: 32px 48px;
          display: flex;
          flex-direction: column;
          justify-content: center;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          position: relative;
          overflow: hidden;
        }

        .grid-bg {
          position: absolute;
          inset: 0;
          background-image: linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                            linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
          background-size: 24px 24px;
          mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
        }

        .badge-terminal {
          display: inline-flex;
          align-items: center;
          gap: 8px;
          background: rgba(0, 150, 136, 0.12);
          border: 1px solid rgba(0, 150, 136, 0.35);
          color: #4FC08D;
          padding: 4px 12px;
          border-radius: 20px;
          font-size: 11px;
          font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
          letter-spacing: 0.5px;
          width: fit-content;
          margin-bottom: 12px;
          z-index: 1;
        }

        .pulse-dot {
          width: 6px;
          height: 6px;
          background-color: #4FC08D;
          border-radius: 50%;
          animation: pulse 2s infinite;
        }

        .title {
          font-size: 32px;
          font-weight: 800;
          color: #F8FAFC;
          letter-spacing: -0.5px;
          margin: 0 0 6px 0;
          z-index: 1;
        }

        .title-gradient {
          background: linear-gradient(90deg, #009688 0%, #4FC08D 100%);
          -webkit-background-clip: text;
          -webkit-text-fill-color: transparent;
        }

        .subtitle {
          font-size: 15px;
          font-weight: 500;
          color: #94A3B8;
          margin: 0 0 16px 0;
          z-index: 1;
        }

        .tags-row {
          display: flex;
          gap: 10px;
          z-index: 1;
          flex-wrap: wrap;
        }

        .tag {
          font-size: 11px;
          font-weight: 600;
          color: #CBD5E1;
          background: rgba(255, 255, 255, 0.04);
          border: 1px solid rgba(255, 255, 255, 0.08);
          padding: 3px 10px;
          border-radius: 6px;
          font-family: ui-monospace, monospace;
        }

        @keyframes pulse {
          0% { transform: scale(0.95); opacity: 0.6; }
          50% { transform: scale(1.3); opacity: 1; }
          100% { transform: scale(0.95); opacity: 0.6; }
        }
      </style>

      <div class="container">
        <div class="grid-bg"></div>
        
        <div class="badge-terminal">
          <span class="pulse-dot"></span>
          <span>SYSTEM ONLINE // READY TO DEPLOY</span>
        </div>

        <h1 class="title">Wiliam Sanchez <span class="title-gradient">/ Full Stack</span></h1>
        <p class="subtitle">Tecnólogo en Desarrollo de Software · Arquitectura Empresarial &amp; Soluciones Escalables</p>
        
        <div class="tags-row">
          <span class="tag">FastAPI</span>
          <span class="tag">Vue 3 / PrimeVue</span>
          <span class="tag">SQLAlchemy</span>
          <span class="tag">MariaDB / MySQL</span>
          <span class="tag">Docker</span>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>
